spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/queue_ticketing_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 3000ms

redisson:
  address: redis://${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}
  database: 0
  timeout: 3000

queue:
  ticket:
    idempotency-key-ttl: 300
    default-ahead-notify-count: 3
